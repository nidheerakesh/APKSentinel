[project]
name = "malware-analyzer"
version = "0.1.0"
description = "Multi-agent Android malware analysis with explainable GAT classification"
requires-python = ">=3.10"
dependencies = [
    "androguard>=3.3.5",
    "streamlit>=1.28",
    "streamlit-shadcn-ui",
    "pyvis>=0.3.2",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "tqdm>=4.65",
    "seaborn>=0.12",
    "torch>=2.0",
    "torch-geometric>=2.4",
    "networkx>=2.8",
    "plotly>=5.0",
    "matplotlib>=3.5",
]

[project.scripts]
analyze = "pipeline.process:main"
download = "pipeline.download:main"
train = "model.train:main"
demo = "demo.app:main"
